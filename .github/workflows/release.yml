name: Release

# Тег vX.Y.Z (или ручной запуск с существующим тегом) собирает подписанный установщик,
# кладёт его и latest.json в черновик релиза и публикует релиз целиком.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для выпуска (например v0.1.26); должен уже существовать"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  config:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.TAG }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signing key is configured
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Секрет TAURI_SIGNING_PRIVATE_KEY не задан: подписать обновление нечем."
            exit 1
          fi
      - name: Tag matches the app version
        id: version
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::тег $TAG не совпадает с версией $version в src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Version, updater channel and public tree
        run: node scripts/check-release-config.mjs --repo "$GITHUB_REPOSITORY"

  create-release:
    name: Draft release
    needs: config
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.TAG }}"
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              if (!existing.draft) core.setFailed(`релиз ${tag} уже опубликован`);
              core.setOutput("id", existing.id);
              return;
            }
            const previous = releases.find((r) => !r.draft && !r.prerelease);
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              owner, repo, tag_name: tag, previous_tag_name: previous?.tag_name,
            });
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `Sombra ${tag}`,
              draft: true, prerelease: tag.includes("-"), body: notes.body,
            });
            core.setOutput("id", data.id);

  build:
    name: Build Windows x64
    needs: [config, create-release]
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.TAG }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
          cache-on-failure: true
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ env.TAG }}
          args: --config src-tauri/tauri.release.json
          # latest.json собирается один раз в updater-manifest, а не каждой сборкой.
          uploadUpdaterJson: false
      - name: Installer assets
        shell: bash
        run: |
          ls -l target/release/bundle/nsis/
          test -n "$(ls target/release/bundle/nsis/*.exe.sig)"

  updater-manifest:
    name: Updater manifest
    needs: [config, create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.TAG }}"
      # Подписи скачиваются из черновика тем же API, что и у tauri-action: файл пишется байт в байт.
      - name: Signatures from the draft
        run: |
          mkdir -p "$RUNNER_TEMP/sigs"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$RUNNER_TEMP/sigs/$name"
            done
          ls -l "$RUNNER_TEMP/sigs"
      - name: Release notes
        run: |
          : > "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md" || true
      - name: Build latest.json
        run: |
          node scripts/build-updater-manifest.mjs \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --version "${{ needs.config.outputs.version }}" \
            --sigs "$RUNNER_TEMP/sigs" --notes "$RUNNER_TEMP/notes.md" --out latest.json
          cat latest.json
      - name: Upload to the draft
        run: gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish
    needs: [create-release, updater-manifest]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ env.TAG }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID), draft: false,
            });
      # Тот же клиентский путь: манифест из releases/latest, установщик и подпись по ключу из конфига.
      - name: Verify the published update
        run: node scripts/verify-release.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY"
