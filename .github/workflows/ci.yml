name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  config:
    name: Version, updater and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release configuration
        run: node scripts/check-release-config.mjs --repo "$GITHUB_REPOSITORY"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npx tsc --noEmit
      - name: FSD boundaries
        run: npm run check:fsd
      - name: Build
        run: npm run build
      - name: Unit tests
        run: |
          npm run test:updater
          npm run test:avatars
          npm run test:src

  rust:
    name: Rust tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-tests
          cache-on-failure: true
      # tauri::generate_context!() встраивает фронтенд и падает без dist/.
      - name: Frontend for generate_context
        run: |
          npm ci
          npm run build
      - name: Test the API and the app
        run: cargo test --workspace --locked
      - name: Build the server binary
        run: cargo build --locked -p sombra-server
