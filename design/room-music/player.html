<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="dsh-design" content="desktop windows"><title>Музыка в комнате · Sombra</title><link rel="stylesheet" href="room-music.css"><style>:root{color-scheme:dark;font:14px 'Segoe UI',sans-serif;background:#14141c;color:#f6f4fc}body{margin:0;min-height:100vh}main{width:min(100% - 32px,480px);margin:auto;padding:96px 0 32px}h1,p{text-align:center}h1{font-size:24px;margin:0 0 8px}p{color:#bcb9cc;margin:0 0 24px}button,input{font:inherit}button{cursor:pointer}svg{flex:none}</style><main><h1>Голосовая комната</h1><p>Предпросмотр плеера · тестовые треки</p><section class="room-music" aria-label="Музыка в комнате"><header class="room-music-header"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="18" cy="16" rx="3" ry="2"/></svg> Музыка в комнате</span><button type="button" aria-expanded="true" aria-controls="queue" id="toggle">Очередь <span>2</span></button></header><div class="room-music-track"><span class="room-music-art"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="18" cy="16" rx="3" ry="2"/></svg></span><div><strong>Ночной маршрут</strong><small>Сейчас играет</small></div></div><div class="room-music-progress"><span>0:42</span><progress value="42" max="184" aria-label="Позиция воспроизведения"></progress><span>3:04</span></div><div class="room-music-actions"><button type="button" class="room-music-primary" aria-label="Пауза" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5v14m6-14v14"/></svg></button><button type="button" aria-label="Следующий трек" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 5 12 7-12 7zm14 0v14"/></svg></button><button type="button" aria-label="Остановить" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button><label><input aria-label="Громкость музыки для вас" type="range" value="65"></label></div><div id="queue"><ol class="room-music-queue"><li><span>После полуночи</span><small>2:36</small></li><li><span>Окна города</span><small>4:12</small></li></ol></div><div class="room-music-add"><input aria-label="Ссылка на трек" placeholder="Ссылка на трек"><button type="button" disabled>Добавить</button></div></section></main><script>const toggle=document.querySelector('#toggle');toggle.onclick=()=>{const list=document.querySelector('#queue');list.hidden=!list.hidden;toggle.setAttribute('aria-expanded',String(!list.hidden))};</script></html>
