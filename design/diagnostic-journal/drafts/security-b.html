<!doctype html><html lang="ru"><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="dsh-design" content="desktop windows"><title>Пароль и безопасность B · Sombra</title><link rel="stylesheet" href="journal.css"><link rel="stylesheet" href="account-preview.css"><script defer src="account-preview.js"></script><style>.secure-split{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:24px;align-items:start}.secure-note{padding:24px;background:var(--field);border:1px solid var(--border);border-radius:var(--radius)}.secure-note h2{font-size:20px;margin-bottom:12px}.secure-note .hint{font-size:14px}.secure-split .preview-form{width:100%;max-width:none}@media(max-width:720px){.secure-split{grid-template-columns:1fr}}</style><body><main class="window" data-section="security"><section class="pane"><header class="pane-head"><h1>Пароль и безопасность</h1></header><div class="pane-body secure-split"><aside class="secure-note"><h2>Смена пароля</h2><p class="hint" id="password-hint">Не менее 8 символов. После смены пароля потребуется войти заново на всех устройствах.</p></aside><div class="stack preview-form"><label class="field"><span>Текущий пароль</span><input type="password" class="input" autocomplete="current-password"></label><label class="field"><span>Новый пароль</span><input type="password" class="input" minlength="8" autocomplete="new-password" aria-describedby="password-hint"></label><label class="field"><span>Повторите пароль</span><input type="password" class="input" minlength="8" autocomplete="new-password"></label><div class="actions"><button class="btn btn--primary" type="button">Изменить пароль</button></div></div></div></section></main></body></html>
