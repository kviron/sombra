<!doctype html><html lang="ru"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="dsh-design" content="desktop windows"><title>Учётная запись C · Sombra</title><link rel="stylesheet" href="journal.css"><script defer src="account-preview.js"></script><style>
.settings-section{border:1px solid var(--border);border-radius:var(--radius);background:var(--field);min-width:0}.settings-section>header,.settings-row,.settings-actions{padding:12px 16px}.settings-section h2{font-size:15px}.settings-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center;gap:12px;border-top:1px solid var(--border)}.settings-actions{display:flex;justify-content:flex-end;border-top:1px solid var(--border)}.settings-media{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.settings-media .avatar{flex:0 0 36px;height:36px}.cover-thumb{width:64px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:linear-gradient(110deg,var(--glow-cool),var(--glow-violet))}.settings-section .hint{margin-top:2px}.file-label{position:relative;cursor:pointer;overflow:hidden}.file-label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.file-label:focus-within{outline:2px solid var(--ring)}@media(max-width:620px){.settings-row{grid-template-columns:1fr}}
</style></head><body><main class="window" data-section="profile"><section class="pane"><header class="pane-head"><div><h1>Учётная запись</h1><p>Профиль и данные для входа.</p></div></header><div class="pane-body">
<section class="settings-section" aria-labelledby="appearance"><header><h2 id="appearance">Оформление профиля</h2></header><div class="settings-row"><strong>Аватар</strong><div class="settings-media"><span class="avatar" id="avatar-c" aria-hidden="true">H</span><label class="btn btn--secondary file-label">Изменить аватар<input type="file" accept="image/*" data-target="avatar-c"></label></div></div><div class="settings-row"><strong>Обложка</strong><div class="settings-media"><span class="cover-thumb" id="cover-c" aria-hidden="true"></span><label class="btn btn--secondary file-label">Изменить обложку<input type="file" accept="image/*" data-target="cover-c"></label></div></div></section>
<section class="settings-section" aria-labelledby="info"><header><h2 id="info">Личные данные</h2></header><label class="settings-row"><strong>Имя пользователя</strong><input class="input" value="HollyWood" autocomplete="nickname" maxlength="32"></label><label class="settings-row"><strong>О себе</strong><input class="input" maxlength="190" placeholder="Добавьте описание"></label><div class="settings-actions"><button class="btn btn--primary" type="button" id="save-c">Сохранить профиль</button></div><p class="hint" id="status-c" role="status" hidden></p></section>
<section class="settings-section" aria-labelledby="email-c"><header><h2 id="email-c">Электронная почта</h2></header><label class="settings-row"><strong>Почта</strong><input class="input" type="email" autocomplete="email" value="hollywood@example.com"></label><label class="settings-row"><strong>Текущий пароль</strong><input class="input" type="password" autocomplete="current-password"></label><div class="settings-actions"><button class="btn btn--secondary" type="button" disabled>Изменить почту</button></div></section>
</div></section></main><script>
for(const input of document.querySelectorAll('[data-target]')){let url;input.onchange=()=>{const file=input.files[0];if(!file?.type.startsWith('image/'))return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);const target=document.getElementById(input.dataset.target);target.style.background=`center / cover no-repeat url(${url})`;if(target.classList.contains('avatar'))target.style.color='transparent'}}
document.querySelector('#save-c').onclick=()=>{const status=document.querySelector('#status-c');status.hidden=false;status.textContent='Это макет. Изменения не отправляются.';status.style.padding='0 16px 12px'};
</script></body></html>
