<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="dsh-design" content="desktop windows"><title>Вход · Sombra</title><link rel="stylesheet" href="journal.css"><style>
.login{width:min(100%,440px);padding:clamp(20px,4vw,36px);background:var(--card-solid);border:1px solid var(--border);border-radius:var(--radius-xl)}.login-brand{display:flex;justify-content:center;align-items:center;gap:10px;font-size:24px;margin-bottom:24px}.login h1{text-align:center;font-size:24px}.login-intro{text-align:center;margin-top:8px}.login form{display:grid;gap:16px;margin-top:28px}.login .field>span{color:var(--foreground);font-size:14px}.login .input,.login .btn{height:44px}.login-pass{position:relative}.login-pass input{padding-inline-end:48px}.login-pass button{position:absolute;inset:0 0 0 auto;width:44px;height:44px}.login-remember{--check-size:16px;--check-gap:10px}.login-check{display:flex;align-items:center;gap:var(--check-gap);min-height:26px;cursor:pointer;position:relative}.login-check input{position:absolute;inset-inline-start:-4px;width:24px;height:24px;margin:0;opacity:0;cursor:pointer}.login-check-mark{display:grid;place-items:center;flex:0 0 var(--check-size);height:var(--check-size);border:1px solid var(--input-line);border-radius:4px;background:var(--field);color:var(--primary-foreground);pointer-events:none}.login-check-mark svg{visibility:hidden}.login-check input:checked+.login-check-mark{background:var(--primary);border-color:var(--primary)}.login-check input:checked+.login-check-mark svg{visibility:visible}.login-check input:focus-visible+.login-check-mark{outline:2px solid var(--ring);outline-offset:2px}.login-remember .hint{padding-inline-start:calc(var(--check-size) + var(--check-gap))}.login-foot{text-align:center;margin-top:20px}.login a{display:inline-flex;align-items:center;min-height:24px;color:var(--link)}
</style></head><body><main class="login" aria-label="Вход в Sombra">
<h1 class="login-brand">Sombra</h1>
<form id="login-form"><label class="field"><span>Электронная почта</span><input class="input" type="email" autocomplete="off" placeholder="you@example.com" required maxlength="254"></label><div class="field"><span><label for="login-password">Пароль</label></span><div class="login-pass"><input class="input" id="login-password" type="password" autocomplete="off" placeholder="Введите пароль" required><button class="icon-btn" id="toggle-password" type="button" aria-label="Показать пароль" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path id="eye-slash" d="m3 3 18 18" visibility="hidden"/></svg></button></div></div>
<div class="login-remember"><label class="login-check"><input type="checkbox" aria-describedby="remember-hint"><span class="login-check-mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></span><span>Оставаться в системе</span></label><p class="hint" id="remember-hint">Сохранять вход на этом устройстве в течение года.</p></div>
<button class="btn btn--primary" type="submit">Войти</button><p id="login-status" class="hint" role="status" hidden></p></form>
<p class="login-foot muted">Нет аккаунта? <a href="#register" id="register-link">Создать аккаунт</a></p><p class="login-foot"><a href="index.html">Назад к настройкам</a></p>
</main><script>
const pass=document.querySelector('#login-password'), eye=document.querySelector('#toggle-password'), status=document.querySelector('#login-status');
eye.onclick=()=>{const show=pass.type==='password';pass.type=show?'text':'password';eye.setAttribute('aria-pressed',String(show));eye.setAttribute('aria-label',show?'Скрыть пароль':'Показать пароль');document.querySelector('#eye-slash').setAttribute('visibility',show?'visible':'hidden');};
function notice(text){status.hidden=false;status.textContent=text;}
document.querySelector('#login-form').onsubmit=e=>{e.preventDefault();notice('Это макет. Данные не отправляются.');};
document.querySelector('#register-link').onclick=e=>{e.preventDefault();notice('Регистрация не подключена в макете.');};
</script></body></html>
