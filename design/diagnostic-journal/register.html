<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="dsh-design" content="desktop windows"><title>Регистрация · Sombra</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="auth-alternatives.css"><script defer src="auth-preview.js"></script><link rel="stylesheet" href="auth-ambient.css"></head><body class="login-ambient"><div class="login-particles" aria-hidden="true"><canvas class="login-glitch"></canvas><script defer src="login-glitch.js"></script></div><main class="auth bare"><strong class="brand">Sombra</strong><h1>Создать аккаунт</h1><form method="post"><label class="field"><span>Имя пользователя</span><input class="input" required minlength="2" maxlength="32" pattern=".*\S.*" placeholder="Как вас называть?"></label><label class="field"><span>Электронная почта</span><input class="input" type="email" required maxlength="254" placeholder="you@example.com"></label><div class="field"><span><label for="password">Пароль</label></span><div class="pass"><input class="input" id="password" type="password" required minlength="8" placeholder="Не менее 8 символов"><button type="button" class="icon-btn" data-password aria-label="Показать пароль">◉</button></div></div><label class="field"><span>Подтвердите пароль</span><input class="input" id="confirmation" type="password" required minlength="8" placeholder="Повторите пароль"></label><button class="btn btn--primary">Создать аккаунт</button><p class="auth-status" role="status" hidden></p></form><footer><p>Уже есть аккаунт? <a href="login.html">Войти</a></p></footer></main></body></html>
