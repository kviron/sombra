<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="dsh-design" content="desktop windows"><title>Пароль и безопасность · Sombra</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="journal.css"><link rel="stylesheet" href="account-preview.css"><script defer src="account-preview.js"></script><style>.secure-sequence{width:100%;max-width:var(--security-form-width);gap:var(--security-section-gap)}.secure-step{display:grid;gap:var(--security-field-gap);border-block-start:1px solid var(--border);padding-block-start:var(--security-section-padding)}.secure-step h2{font-size:var(--security-section-title-size)}.secure-sequence .actions{justify-content:flex-end}</style><body><main class="window" data-section="security"><section class="pane"><header class="pane-head"><h1>Пароль и безопасность</h1></header><div class="pane-body"><div class="stack preview-form secure-sequence"><section class="secure-step"><h2>1. Подтвердите текущий пароль</h2><label class="field"><span>Текущий пароль</span><input type="password" class="input" autocomplete="current-password"></label></section><section class="secure-step"><h2>2. Задайте новый пароль</h2><label class="field"><span>Новый пароль</span><input type="password" class="input" minlength="8" autocomplete="new-password" aria-describedby="password-hint"></label><label class="field"><span>Повторите пароль</span><input type="password" class="input" minlength="8" autocomplete="new-password"></label><p class="hint" id="password-hint">Не менее 8 символов. После смены пароля потребуется войти заново на всех устройствах.</p></section><div class="actions"><button class="btn btn--primary" type="button">Изменить пароль</button></div></div></div></section></main></body></html>
