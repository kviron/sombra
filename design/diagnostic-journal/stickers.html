<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="dsh-design" content="desktop windows"><title>Стикеры · Sombra</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="journal.css"><link rel="stylesheet" href="account-preview.css"><script defer src="account-preview.js"></script><script defer src="sticker-studio.js"></script><link rel="stylesheet" href="sticker-studio.css"><style>.catalog-alt{display:grid;gap:var(--sticker-catalog-gap)}.catalog-alt h2{font-size:18px;line-height:1.4}.catalog-alt .actions{margin:0}.catalog-alt [data-sticker-panel]{padding:24px;min-height:128px}.catalog-alt [data-sticker-panel][hidden]{display:none}.pack-create{display:grid;gap:12px;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--field);align-content:start}.pack-create>svg{color:var(--link)}.pack-create .btn{justify-self:start;min-height:44px}.catalog-main{display:grid;gap:12px;min-width:0}.pack-create{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;padding:var(--sticker-banner-padding);border-inline-start:var(--sticker-banner-accent-width) solid var(--link)}.catalog-main{padding-block-start:12px;border-top:1px solid var(--border)}.catalog-alt [data-sticker-panel]{min-height:96px;background:transparent;border:0;padding-inline:0}@media(max-width:680px){.pack-create{grid-template-columns:1fr;padding:var(--sticker-banner-padding-compact)}}</style><style>#sticker-catalog-tabs [data-slot=tabs-list]{display:flex;gap:4px;border-bottom:1px solid var(--border)}#sticker-catalog-tabs [data-slot=tabs-trigger]{font:inherit;font-weight:500;color:var(--muted-foreground);background:transparent;border:0;border-bottom:2px solid transparent;min-height:44px;padding:0 14px;cursor:pointer}#sticker-catalog-tabs [data-slot=tabs-trigger]:hover,#sticker-catalog-tabs [data-state=active]{color:var(--foreground)}#sticker-catalog-tabs [data-slot=tabs-trigger][data-state=active]{border-bottom-color:var(--link)}#sticker-catalog-tabs :focus-visible{outline:2px solid var(--ring);outline-offset:-2px}</style><script defer src="assets/sticker-catalog-tabs.js"></script><body><main class="window" data-section="stickers"><section class="pane"><header class="pane-head"><h1>Стикеры</h1></header><div class="pane-body catalog-alt"><section class="pack-create"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M20 13V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7l7-7Z"/><path d="M13 20v-5a2 2 0 0 1 2-2h5M8 9h.01M15 9h.01M8 13c1 1 2 1 3 1"/></svg><div><h2>Свой набор</h2><p class="muted">Загрузите ZIP-архив или создайте набор с Sombra.</p></div><button class="btn btn--primary" type="button" id="open-sticker-studio" aria-haspopup="dialog">Добавить свой набор</button></section><section class="catalog-main" aria-label="Каталог стикеров"><h2>Коллекция стикеров</h2><div id="sticker-catalog-tabs"></div></section></div></section></main>
<dialog class="studio" aria-labelledby="studio-title">
<header class="studio-head"><h2 id="studio-title">Добавить свой набор</h2><form method="dialog"><button class="icon-btn" aria-label="Закрыть">×</button></form></header>
<div class="studio-tabs" role="tablist" aria-label="Способ добавления"><button type="button" class="btn" role="tab" id="upload-tab" aria-selected="true" aria-controls="upload-panel">Загрузить</button><button type="button" class="btn" role="tab" id="create-tab" aria-selected="false" aria-controls="create-panel" tabindex="-1">Создать</button></div>
<section class="studio-upload" id="upload-panel" role="tabpanel" aria-labelledby="upload-tab"><label class="studio-drop"><input type="file" id="sticker-zip" accept=".zip,application/zip"><strong>Перетащите ZIP-архив сюда</strong><span class="muted">или нажмите, чтобы выбрать файл</span></label><p class="hint" id="zip-status" role="status"></p></section>
<section class="studio-create" id="create-panel" role="tabpanel" aria-labelledby="create-tab" hidden>
<div class="studio-chat" role="log" aria-label="Чат с Sombra"><div class="studio-message"><strong>Sombra</strong><p>Опишите персонажа, стиль и эмоции для набора. Можно приложить картинки или файл с описанием.</p></div></div>
<form class="studio-composer"><label class="field"><span>Сообщение для Sombra</span><textarea class="input" rows="2" required placeholder="Например: рыжий кот, шесть эмоций, прозрачный фон"></textarea></label><div class="row-between"><label class="studio-attach btn btn--secondary"><input type="file" multiple accept="image/*,.txt,.md,.pdf,.docx,.rtf">Прикрепить файлы</label><button class="btn btn--primary" type="submit">Создать</button></div><div class="studio-files" aria-live="polite"></div></form>
</section></dialog></body></html>
