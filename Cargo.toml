[package]
name = "mines-chat"
version = "0.1.14"
edition = "2021"
build = "build.rs"
default-run = "mines-chat"

[[bin]]
name = "mines-chat"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "mines-server"
path = "src/server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri = { version = "2", features = ["tray-icon"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security_Cryptography", "Win32_System_WinRT"] }

[features]
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-updater"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

