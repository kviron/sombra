[workspace]
resolver = "2"
members = ["src-tauri", "crates/sombra-core", "crates/sombra-server"]

[workspace.package]
version = "0.1.38"
edition = "2021"

# Smaller and faster release builds: one codegen unit, thin LTO, stripped symbols.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
